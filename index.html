<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #05060a;
    font-family: 'Georgia', serif;
    color: #e8f1ff;
  }

  /* ============ FONDO NEUTRO CON DESTELLOS ============ */
  .fondo {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, #101625 0%, #05060a 70%);
    z-index: 0;
  }

  .destello {
    position: fixed;
    width: 3px;
    height: 3px;
    background: #ffffff;
    border-radius: 50%;
    box-shadow: 0 0 10px 2px rgba(180, 210, 255, 0.9);
    animation: titilar linear infinite;
    z-index: 1;
    pointer-events: none;
  }
  @keyframes titilar {
    0%, 100% { opacity: 0.1; transform: scale(0.6); }
    50%      { opacity: 1;   transform: scale(1.4); }
  }

  .fondo::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(120, 160, 255, 0.12) 0%, transparent 65%);
    animation: respirar 7s ease-in-out infinite;
  }
  @keyframes respirar {
    0%, 100% { opacity: 0.4; }
    50%      { opacity: 1; }
  }

  /* ============ PANTALLAS ============ */
  .pantalla {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    z-index: 10;
    transition: opacity 1.4s ease, visibility 1.4s ease, transform 1.4s ease;
  }
  .pantalla.oculta {
    opacity: 0;
    visibility: hidden;
    transform: scale(0.96);
  }

  /* ============ PANTALLA 1: INTRO NEUTRA ============ */
  #intro .frase {
    color: #e8f1ff;
    letter-spacing: 1px;
    line-height: 1.6;
    max-width: 700px;
    min-height: 3.2em;
    font-weight: normal;
    text-shadow: 0 0 25px rgba(180, 210, 255, 0.5);
    transition: opacity 0.9s ease, transform 0.9s ease, font-size 0.9s ease;
    font-size: clamp(1.4rem, 4.5vw, 2.2rem);
  }

  /* "Hola..." más grande y con más presencia */
  #intro .frase.grande {
    font-size: clamp(2.8rem, 9vw, 4.5rem);
    letter-spacing: 3px;
    text-shadow: 0 0 40px rgba(180, 210, 255, 0.9);
  }

  /* Frase que se desvanece */
  #intro .frase.desvanece {
    opacity: 0;
    transform: translateY(-15px);
  }

  .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: #cfe3ff;
    margin-left: 4px;
    vertical-align: middle;
    animation: parpadeo 0.8s steps(1) infinite;
  }
  @keyframes parpadeo { 50% { opacity: 0; } }

  .btn-siguiente {
    margin-top: 55px;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 1.5px solid rgba(200, 220, 255, 0.55);
    background: rgba(255, 255, 255, 0.03);
    color: #cfe3ff;
    font-size: 1.6rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 1.2s ease, background 0.4s ease, box-shadow 0.4s ease;
    backdrop-filter: blur(4px);
  }
  .btn-siguiente.visible {
    opacity: 1;
    animation: flotarFlecha 2.4s ease-in-out infinite;
  }
  .btn-siguiente:hover {
    background: rgba(200, 220, 255, 0.15);
    box-shadow: 0 0 35px rgba(160, 200, 255, 0.7);
    transform: translateY(-4px);
  }
  @keyframes flotarFlecha {
    0%, 100% { transform: translateY(0);   box-shadow: 0 0 15px rgba(160, 200, 255, 0.35); }
    50%      { transform: translateY(-8px); box-shadow: 0 0 30px rgba(160, 200, 255, 0.75); }
  }

  /* ============ PANTALLA 2: EXPLOSIÓN ============ */
  #explosion {
    position: fixed;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    overflow: hidden;
    display: none;
  }

  .ramo-volador {
    position: absolute;
    opacity: 0;
    animation: brotarRamo 3s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes brotarRamo {
    0%   { opacity: 0; transform: scale(0) rotate(-90deg); }
    40%  { opacity: 1; transform: scale(1.15) rotate(10deg); }
    70%  { opacity: 1; transform: scale(1) rotate(0deg); }
    100% { opacity: 0.95; transform: scale(1.2) rotate(-5deg); }
  }

  /* ============ PANTALLA 3: TARJETA FINAL ============ */
  #final {
    display: none;
    z-index: 30;
  }
  #final.activo {
    display: flex;
    animation: aparecerFinal 1.5s ease-out forwards;
  }
  @keyframes aparecerFinal {
    from { opacity: 0; transform: scale(0.9); }
    to   { opacity: 1; transform: scale(1); }
  }

  .tarjeta {
    max-width: 560px;
    width: 100%;
    background: linear-gradient(160deg, #1a1305 0%, #2b1e08 100%);
    border-radius: 28px;
    padding: 48px 36px;
    text-align: center;
    border: 2px solid #ffd93b;
    box-shadow:
      0 0 60px rgba(255, 210, 60, 0.55),
      inset 0 0 40px rgba(255, 210, 60, 0.08);
    position: relative;
  }

  .tarjeta::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 30px;
    background: linear-gradient(45deg, #ffd93b, transparent, #ffd93b, transparent);
    background-size: 300% 300%;
    z-index: -1;
    animation: bordeGirar 6s linear infinite;
    filter: blur(8px);
    opacity: 0.6;
  }
  @keyframes bordeGirar {
    0%   { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  .ramo-central {
    width: 190px;
    height: 190px;
    margin: 0 auto 16px;
    filter: drop-shadow(0 0 25px rgba(255, 210, 60, 0.7));
    animation: flotarRamo 4s ease-in-out infinite;
  }
  @keyframes flotarRamo {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50%      { transform: translateY(-12px) rotate(2deg); }
  }

  .titulo {
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    color: #ffd93b;
    letter-spacing: 2px;
    margin-bottom: 22px;
    text-shadow: 0 0 22px rgba(255, 210, 60, 0.85);
    font-weight: normal;
  }

  .mensaje {
    font-size: 1.12rem;
    color: #ffe98a;
    line-height: 1.85;
    margin-bottom: 26px;
    padding: 0 6px;
  }

  .cierre {
    font-size: 1rem;
    color: #ffd93b;
    font-style: italic;
    border-top: 1px dashed rgba(255, 217, 59, 0.5);
    padding-top: 18px;
    letter-spacing: 1px;
  }

  .corazon {
    font-size: 1.7rem;
    margin-top: 14px;
    display: inline-block;
    animation: latir 1.4s ease-in-out infinite;
    filter: drop-shadow(0 0 12px rgba(255, 210, 60, 0.9));
  }
  @keyframes latir {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.3); }
  }

  .petalo-dorado {
    position: fixed;
    top: -80px;
    z-index: 25;
    pointer-events: none;
    animation: caer linear infinite;
    filter: drop-shadow(0 0 12px rgba(255, 210, 60, 0.6));
  }
  @keyframes caer {
    0%   { transform: translateY(-80px) rotate(0deg); opacity: 0; }
    8%   { opacity: 0.9; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  @media (max-width: 480px) {
    .tarjeta { padding: 34px 22px; }
    .ramo-central { width: 150px; height: 150px; }
    .mensaje { font-size: 1rem; }
    .btn-siguiente { width: 56px; height: 56px; font-size: 1.4rem; }
  }
</style>
</head>
<body>

  <div class="fondo"></div>

  <!-- ============ PANTALLA 1: INTRO NEUTRA ============ -->
  <div class="pantalla" id="intro">
    <p class="frase" id="frase"></p>
    <button class="btn-siguiente" id="btnSiguiente" aria-label="Siguiente">➜</button>
  </div>

  <!-- ============ PANTALLA 2: EXPLOSIÓN ============ -->
  <div id="explosion"></div>

  <!-- ============ PANTALLA 3: TARJETA FINAL ============ -->
  <div class="pantalla" id="final">
    <div class="tarjeta">
      <svg class="ramo-central" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <path d="M100 195 Q95 150 85 110" stroke="#3d7a2e" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M100 195 Q105 150 115 110" stroke="#3d7a2e" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M100 195 Q100 155 100 120" stroke="#3d7a2e" stroke-width="5" fill="none" stroke-linecap="round"/>
        <ellipse cx="80" cy="150" rx="18" ry="8" fill="#4c9c39" transform="rotate(-30 80 150)"/>
        <ellipse cx="122" cy="155" rx="18" ry="8" fill="#4c9c39" transform="rotate(30 122 155)"/>
        <ellipse cx="100" cy="170" rx="16" ry="7" fill="#3d7a2e"/>
        <g>
          <ellipse cx="100" cy="85" rx="10" ry="26" fill="#ffd93b"/>
          <ellipse cx="100" cy="85" rx="10" ry="26" fill="#ffd93b" transform="rotate(45 100 85)"/>
          <ellipse cx="100" cy="85" rx="10" ry="26" fill="#ffd93b" transform="rotate(90 100 85)"/>
          <ellipse cx="100" cy="85" rx="10" ry="26" fill="#ffd93b" transform="rotate(135 100 85)"/>
          <circle cx="100" cy="85" r="18" fill="#8b5a2b"/>
          <circle cx="100" cy="85" r="12" fill="#6b4220"/>
        </g>
        <g>
          <ellipse cx="62" cy="95" rx="8" ry="20" fill="#ffe14d"/>
          <ellipse cx="62" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(45 62 95)"/>
          <ellipse cx="62" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(90 62 95)"/>
          <ellipse cx="62" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(135 62 95)"/>
          <circle cx="62" cy="95" r="14" fill="#8b5a2b"/>
        </g>
        <g>
          <ellipse cx="138" cy="95" rx="8" ry="20" fill="#ffe14d"/>
          <ellipse cx="138" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(45 138 95)"/>
          <ellipse cx="138" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(90 138 95)"/>
          <ellipse cx="138" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(135 138 95)"/>
          <circle cx="138" cy="95" r="14" fill="#8b5a2b"/>
        </g>
      </svg>

      <h1 class="titulo">FLORES AMARILLAS PARA TI 💛</h1>

      <p class="mensaje">
        Solo quería recordarte que eres muy especial<br>
        y se te quiere mucho.<br>
        Que tengas un excelente día 🌻💛
      </p>

      <p class="cierre">Con mucho cariño ✨</p>
      <div class="corazon">💛</div>
    </div>
  </div>

  <audio id="musica" src="musica.mp3" loop></audio>

<script>
  /* ================= DESTELLOS DE FONDO ================= */
  function crearDestello() {
    const d = document.createElement('div');
    d.className = 'destello';
    d.style.left = Math.random() * 100 + 'vw';
    d.style.top  = Math.random() * 100 + 'vh';
    d.style.animationDuration = (1.5 + Math.random() * 3) + 's';
    d.style.animationDelay    = (Math.random() * 3) + 's';
    document.body.appendChild(d);
  }
  for (let i = 0; i < 70; i++) crearDestello();

  /* ================= EFECTO ESCRITURA ================= */
  const frase = document.getElementById('frase');
  const btnSiguiente = document.getElementById('btnSiguiente');

  function escribir(elemento, texto, velocidad, callback) {
    let i = 0;
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    elemento.appendChild(cursor);

    function tick() {
      if (i < texto.length) {
        cursor.insertAdjacentText('beforebegin', texto.charAt(i));
        i++;
        setTimeout(tick, velocidad);
      } else {
        setTimeout(() => {
          cursor.remove();
          if (callback) callback();
        }, 400);
      }
    }
    tick();
  }

  /* ================= SECUENCIA DE LA INTRO ================= */
  // 1) "Hola..." GRANDE durante 5 segundos
  setTimeout(() => {
    frase.classList.add('grande');
    escribir(frase, 'Hola...', 220, () => {
      // Espera 5 segundos después de que termine de escribir "Hola..."
      setTimeout(() => {
        // 2) Se desvanece "Hola..."
        frase.classList.add('desvanece');

        setTimeout(() => {
          // 3) Reemplaza por la segunda frase
          frase.textContent = '';
          frase.classList.remove('grande');
          frase.classList.remove('desvanece');

          escribir(frase, 'Por si pensaste que se olvidaron de ti...', 55, () => {
            // 4) Aparece lentamente el botón
            setTimeout(() => btnSiguiente.classList.add('visible'), 400);
          });
        }, 1000); // tiempo que tarda en desvanecerse
      }, 3000);   // 5 segundos con "Hola..." visible
    });
  }, 900);

  /* ================= CLIC EN SIGUIENTE ================= */
  const musica = document.getElementById('musica');
  const intro = document.getElementById('intro');
  const explosion = document.getElementById('explosion');
  const final = document.getElementById('final');

  btnSiguiente.addEventListener('click', () => {
    musica.volume = 0.6;
    musica.play().catch(() => {});

    intro.classList.add('oculta');
    explosion.style.display = 'block';
    generarExplosion();

    // La explosión dura 5 segundos ahora
    setTimeout(() => {
      explosion.style.opacity = '0';
      explosion.style.transition = 'opacity 1.4s ease';
      final.style.display = 'flex';
      final.classList.add('activo');
      crearPetalosDorados();
    }, 5000);
  });

  /* ================= EXPLOSIÓN DE RAMOS (MÁS GRANDES Y MÁS CANTIDAD) ================= */
  function generarExplosion() {
    const ramoSVG = `
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
        <path d="M100 195 Q95 150 85 110" stroke="#3d7a2e" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M100 195 Q105 150 115 110" stroke="#3d7a2e" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M100 195 Q100 155 100 120" stroke="#3d7a2e" stroke-width="5" fill="none" stroke-linecap="round"/>
        <ellipse cx="80" cy="150" rx="18" ry="8" fill="#4c9c39" transform="rotate(-30 80 150)"/>
        <ellipse cx="122" cy="155" rx="18" ry="8" fill="#4c9c39" transform="rotate(30 122 155)"/>
        <ellipse cx="100" cy="170" rx="16" ry="7" fill="#3d7a2e"/>
        <g>
          <ellipse cx="100" cy="85" rx="10" ry="26" fill="#ffd93b"/>
          <ellipse cx="100" cy="85" rx="10" ry="26" fill="#ffd93b" transform="rotate(45 100 85)"/>
          <ellipse cx="100" cy="85" rx="10" ry="26" fill="#ffd93b" transform="rotate(90 100 85)"/>
          <ellipse cx="100" cy="85" rx="10" ry="26" fill="#ffd93b" transform="rotate(135 100 85)"/>
          <circle cx="100" cy="85" r="18" fill="#8b5a2b"/>
          <circle cx="100" cy="85" r="12" fill="#6b4220"/>
        </g>
        <g>
          <ellipse cx="62" cy="95" rx="8" ry="20" fill="#ffe14d"/>
          <ellipse cx="62" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(45 62 95)"/>
          <ellipse cx="62" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(90 62 95)"/>
          <ellipse cx="62" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(135 62 95)"/>
          <circle cx="62" cy="95" r="14" fill="#8b5a2b"/>
        </g>
        <g>
          <ellipse cx="138" cy="95" rx="8" ry="20" fill="#ffe14d"/>
          <ellipse cx="138" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(45 138 95)"/>
          <ellipse cx="138" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(90 138 95)"/>
          <ellipse cx="138" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(135 138 95)"/>
          <circle cx="138" cy="95" r="14" fill="#8b5a2b"/>
        </g>
      </svg>`;

    // Muchos más ramos y más grandes
    const cantidad = 55;  // antes eran 24
    for (let i = 0; i < cantidad; i++) {
      const ramo = document.createElement('div');
      ramo.className = 'ramo-volador';
      ramo.innerHTML = ramoSVG;

      const tamano = 130 + Math.random() * 220; // entre 130 y 350px
      ramo.style.width  = tamano + 'px';
      ramo.style.height = tamano + 'px';
      ramo.style.left = (Math.random() * 90 - 5) + 'vw';
      ramo.style.top  = (Math.random() * 90 - 5) + 'vh';
      ramo.style.animationDelay = (Math.random() * 1.8) + 's';
      ramo.style.filter = 'drop-shadow(0 0 30px rgba(255, 210, 60, 1))';

      explosion.appendChild(ramo);
    }
  }

  /* ================= PÉTALOS DORADOS FINALES ================= */
  function crearPetalosDorados() {
    const simbolos = ['🌻', '🌼', '💛', '✨'];
    function crear() {
      const p = document.createElement('div');
      p.className = 'petalo-dorado';
      p.textContent = simbolos[Math.floor(Math.random() * simbolos.length)];
      p.style.left = Math.random() * 100 + 'vw';
      p.style.fontSize = (36 + Math.random() * 46) + 'px';
      p.style.animationDuration = (7 + Math.random() * 6) + 's';
      p.style.animationDelay = Math.random() * 5 + 's';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 18000);
    }
    for (let i = 0; i < 12; i++) crear();
    setInterval(crear, 1200);
  }
</script>

</body>
</html>
